name: Update Hubble cask

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Find latest macOS arm64 release
        id: release
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bholmesdev/hubble.md/releases/latest")"
          asset_url="$(jq -r '.assets[]
            | select(.name | test("arm64.*\\.dmg$"; "i"))
            | .browser_download_url' <<<"$release_json" | head -n 1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Latest release has no macOS arm64 DMG"
            exit 1
          fi
          tag="$(jq -r '.tag_name' <<<"$release_json")"
          version="${tag#desktop-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: Download and hash DMG
        id: digest
        env:
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ASSET_URL" -o /tmp/hubble.dmg
          sha256="$(sha256sum /tmp/hubble.dmg | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.digest.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("Casks/hubble-md.rb")
          text = path.read_text()
          text = re.sub(r'version "[^"]+"', f'version "{os.environ["VERSION"]}"', text, count=1)
          text = re.sub(r'sha256 "[^"]+"', f'sha256 "{os.environ["SHA256"]}"', text, count=1)
          path.write_text(text)
          PY

      - name: Commit and push changed cask
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/hubble-md.rb; then
            echo "Cask is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hubble-md.rb
          git commit -m "chore: update Hubble cask to ${{ steps.release.outputs.version }}"
          git push
